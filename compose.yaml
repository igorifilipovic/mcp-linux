services:
  ito-linux-monitor-mcp:
    build:
      context: .
    image: ito-linux-monitor-mcp:local
    container_name: ito-linux-monitor-mcp
    restart: unless-stopped
    init: true

    ports:
      - "${MCP_BIND_ADDRESS:-0.0.0.0}:${MCP_HTTPS_PORT:-8443}:8443"

    environment:
      TARGETS_FILE: /config/targets.yaml
      KNOWN_HOSTS_FILE: /config/known_hosts
      SSH_KEY_FILE: /run/secrets/monitor_ed25519
      SSH_KEY_PASSPHRASE_FILE: /run/secrets/monitor_ed25519.pass
      MCP_BEARER_TOKEN_FILE: /run/secrets/mcp_bearer_token
      TLS_CERT_FILE: /run/tls/server.crt
      TLS_KEY_FILE: /run/tls/server.key
      MCP_PORT: "8443"
      MAX_OUTPUT_BYTES: "${MAX_OUTPUT_BYTES:-1048576}"

    volumes:
      - ./config/targets.yaml:/config/targets.yaml:ro
      - ./config/known_hosts:/config/known_hosts:ro
      - ./secrets/monitor_ed25519:/run/secrets/monitor_ed25519:ro
      - ./secrets/monitor_ed25519.pass:/run/secrets/monitor_ed25519.pass:ro
      - ./secrets/mcp_bearer_token:/run/secrets/mcp_bearer_token:ro
      - ./secrets/tls/server.crt:/run/tls/server.crt:ro
      - ./secrets/tls/server.key:/run/tls/server.key:ro

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import ssl,urllib.request; c=ssl._create_unverified_context(); urllib.request.urlopen('https://127.0.0.1:8443/health',context=c,timeout=5).read()"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
